<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2026;
    --border: #2a2d35;
    --text: #e8eaf0;
    --muted: #7a7f8e;
    --accent: #5f8bff;
    --accent2: #a78bfa;
    --white: #ffffff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    padding: 2.5rem 2rem 1.5rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #111318 0%, transparent 100%);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  header p {
    margin-top: 0.5rem;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 300;
  }

  /* ── Filter Bar ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    padding: 1.5rem 2rem;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(14,15,17,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    padding: 0.4rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: capitalize;
    letter-spacing: 0.02em;
  }
  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--white);
  }

  /* ── Gallery Grid ── */
  .gallery-wrapper {
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .gallery {
    columns: 4 280px;
    column-gap: 1rem;
  }

  .gallery-item {
    break-inside: avoid;
    margin-bottom: 1rem;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: transform 0.3s cubic-bezier(.25,.8,.25,1),
                box-shadow 0.3s ease,
                opacity 0.4s ease;
  }
  .gallery-item.hidden {
    display: none;
  }
  .gallery-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--accent);
  }

  .gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.4s ease;
    filter: brightness(0.92);
  }
  .gallery-item:hover img {
    transform: scale(1.04);
    filter: brightness(1);
  }

  .gallery-item .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,11,14,0.88) 0%, transparent 55%);
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 1rem;
  }
  .gallery-item:hover .overlay {
    opacity: 1;
  }
  .overlay-title {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--white);
  }
  .overlay-cat {
    font-size: 0.72rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }
  .overlay-icon {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .gallery-item:hover .overlay-icon {
    opacity: 1;
  }

  /* ── Lightbox ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(5,6,9,0.95);
    backdrop-filter: blur(16px);
    animation: fadeIn 0.25s ease;
  }
  #lightbox.open { display: flex; align-items: center; justify-content: center; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .lb-inner {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .lb-img-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,0.7);
  }
  #lb-img {
    max-width: 85vw;
    max-height: 78vh;
    object-fit: contain;
    display: block;
    border-radius: 14px;
    transition: opacity 0.2s ease;
  }
  .lb-info {
    margin-top: 1rem;
    text-align: center;
  }
  .lb-info .title {
    font-weight: 600;
    font-size: 1rem;
  }
  .lb-info .cat {
    font-size: 0.8rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 3px;
  }
  .lb-counter {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  /* Nav buttons */
  .lb-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    z-index: 1010;
  }
  .lb-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--white);
  }
  #lb-prev { left: 1.5rem; }
  #lb-next { right: 1.5rem; }
  #lb-close {
    position: fixed;
    top: 1.5rem;
    right: 1.5rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    z-index: 1010;
  }
  #lb-close:hover { background: #e55; border-color: #e55; color: #fff; }

  /* ── No results ── */
  .no-results {
    display: none;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    grid-column: 1 / -1;
  }
  .no-results.visible { display: block; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .gallery { columns: 2 160px; }
    .lb-btn { width: 38px; height: 38px; font-size: 1rem; }
    #lb-prev { left: 0.5rem; }
    #lb-next { right: 0.5rem; }
  }
  @media (max-width: 480px) {
    .gallery { columns: 2 130px; }
    .filter-bar { gap: 0.4rem; padding: 1rem; }
    .gallery-wrapper { padding: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gallery-item, .gallery-item img, .overlay, #lightbox { transition: none; animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Visual Gallery</h1>
  <p>A curated collection — click any image to explore</p>
</header>

<div class="filter-bar" id="filterBar"></div>

<main class="gallery-wrapper">
  <div class="gallery" id="gallery"></div>
  <div class="no-results" id="noResults">No images in this category.</div>
</main>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close" title="Close (Esc)">✕</button>
  <button class="lb-btn" id="lb-prev" title="Previous (←)">&#8592;</button>
  <div class="lb-inner">
    <div class="lb-img-wrap">
      <img id="lb-img" src="" alt="">
    </div>
    <div class="lb-info">
      <div class="title" id="lb-title"></div>
      <div class="cat" id="lb-cat"></div>
      <div class="lb-counter" id="lb-counter"></div>
    </div>
  </div>
  <button class="lb-btn" id="lb-next" title="Next (→)">&#8594;</button>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────
const images = [
  { id:1,  src:'https://picsum.photos/seed/gal1/600/800',  title:'Mountain Mist',    category:'nature'      },
  { id:2,  src:'https://picsum.photos/seed/gal2/800/600',  title:'Urban Geometry',   category:'architecture'},
  { id:3,  src:'https://picsum.photos/seed/gal3/600/900',  title:'Forest Path',      category:'nature'      },
  { id:4,  src:'https://picsum.photos/seed/gal4/700/500',  title:'City at Dusk',     category:'urban'       },
  { id:5,  src:'https://picsum.photos/seed/gal5/500/700',  title:'Lone Traveller',   category:'people'      },
  { id:6,  src:'https://picsum.photos/seed/gal6/900/600',  title:'Glass Tower',      category:'architecture'},
  { id:7,  src:'https://picsum.photos/seed/gal7/600/600',  title:'Autumn Light',     category:'nature'      },
  { id:8,  src:'https://picsum.photos/seed/gal8/800/900',  title:'Portrait Study',   category:'people'      },
  { id:9,  src:'https://picsum.photos/seed/gal9/700/500',  title:'Night Market',     category:'urban'       },
  { id:10, src:'https://picsum.photos/seed/gal10/600/800', title:'Coastal Cliffs',   category:'nature'      },
  { id:11, src:'https://picsum.photos/seed/gal11/800/600', title:'Bridge Lines',     category:'architecture'},
  { id:12, src:'https://picsum.photos/seed/gal12/500/700', title:'Street Café',      category:'urban'       },
  { id:13, src:'https://picsum.photos/seed/gal13/700/900', title:'Golden Hour',      category:'nature'      },
  { id:14, src:'https://picsum.photos/seed/gal14/600/500', title:'Crowd & Light',    category:'people'      },
  { id:15, src:'https://picsum.photos/seed/gal15/900/700', title:'Spiral Staircase', category:'architecture'},
  { id:16, src:'https://picsum.photos/seed/gal16/700/800', title:'Rooftop View',     category:'urban'       },
];

// ── State ─────────────────────────────────────────────────────
let activeFilter = 'all';
let lbIndex = 0;
let visibleItems = [];

// ── Render filters ────────────────────────────────────────────
const categories = ['all', ...new Set(images.map(i => i.category))];
const filterBar = document.getElementById('filterBar');

categories.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (cat === 'all' ? ' active' : '');
  btn.textContent = cat === 'all' ? '✦ All' : cat;
  btn.dataset.cat = cat;
  btn.addEventListener('click', () => setFilter(cat));
  filterBar.appendChild(btn);
});

// ── Render gallery ────────────────────────────────────────────
const gallery = document.getElementById('gallery');
const noResults = document.getElementById('noResults');

images.forEach((img, idx) => {
  const item = document.createElement('div');
  item.className = 'gallery-item';
  item.dataset.cat = img.category;
  item.dataset.idx = idx;
  item.innerHTML = `
    <img src="${img.src}" alt="${img.title}" loading="lazy">
    <div class="overlay">
      <span class="overlay-icon">⤢</span>
      <div class="overlay-title">${img.title}</div>
      <div class="overlay-cat">${img.category}</div>
    </div>
  `;
  item.addEventListener('click', () => openLightbox(idx));
  gallery.appendChild(item);
});

// ── Filter logic ──────────────────────────────────────────────
function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });

  let anyVisible = false;
  document.querySelectorAll('.gallery-item').forEach(item => {
    const show = cat === 'all' || item.dataset.cat === cat;
    item.classList.toggle('hidden', !show);
    if (show) anyVisible = true;
  });

  noResults.classList.toggle('visible', !anyVisible);
}

// ── Lightbox ──────────────────────────────────────────────────
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lb-img');
const lbTitle  = document.getElementById('lb-title');
const lbCat    = document.getElementById('lb-cat');
const lbCounter= document.getElementById('lb-counter');

function getVisible() {
  return images.filter(img => activeFilter === 'all' || img.category === activeFilter);
}

function openLightbox(globalIdx) {
  const img = images[globalIdx];
  visibleItems = getVisible();
  lbIndex = visibleItems.findIndex(i => i.id === img.id);
  showLbImage();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function showLbImage() {
  const img = visibleItems[lbIndex];
  lbImg.style.opacity = '0';
  setTimeout(() => {
    lbImg.src = img.src;
    lbImg.alt = img.title;
    lbTitle.textContent = img.title;
    lbCat.textContent = img.category;
    lbCounter.textContent = `${lbIndex + 1} / ${visibleItems.length}`;
    lbImg.style.opacity = '1';
  }, 150);
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

function lbPrev() {
  lbIndex = (lbIndex - 1 + visibleItems.length) % visibleItems.length;
  showLbImage();
}

function lbNext() {
  lbIndex = (lbIndex + 1) % visibleItems.length;
  showLbImage();
}

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', lbPrev);
document.getElementById('lb-next').addEventListener('click', lbNext);

lightbox.addEventListener('click', e => {
  if (e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLightbox();
  if (e.key === 'ArrowLeft')  lbPrev();
  if (e.key === 'ArrowRight') lbNext();
});

// Touch swipe on lightbox
let touchStartX = 0;
lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
lightbox.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) dx < 0 ? lbNext() : lbPrev();
});
</script>
</body>
</html>
